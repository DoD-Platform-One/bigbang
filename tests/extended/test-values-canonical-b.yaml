packageConfiguration:
  version: v1

packages:
  # Disabled: the twistlock console OOMKills at the chart's memory limit while
  # importing its CVE feed, leaving the package permanently non-functional in CI.
  # Re-enable once a twistlock release fixes the console's memory consumption.
  twistlock:
    enabled: false
  renovate:
    enabled: true
  minioOperator:
    enabled: true
  authservice:
    enabled: true
  externalSecrets:
    enabled: true
  thanos:
    enabled: true
  mimir:
    enabled: true
  harbor:
    enabled: true
  metricsServer:
    enabled: true
