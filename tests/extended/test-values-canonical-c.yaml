packageConfiguration:
  version: v1

packages:
  gitlab:
    enabled: true
  gitlabRunner:
    enabled: true
  minioOperator:
    enabled: true
  minio:
    enabled: true
  velero:
    enabled: true
  headlamp:
    enabled: true

  # GitLab's HelmRelease dependsOn postgresql/redis/garage (and postgresql in
  # turn dependsOn cloudnative-pg), but tests/test-values.yaml ships all four
  # disabled. Without these the gitlab HelmRelease never reconciles.
  cloudnative-pg:
    enabled: true
  postgresql:
    enabled: true
  redis:
    enabled: true
  garage:
    enabled: true
