# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Schema - Package Configuration Version
templates:
  - templates/kiali/helmrelease.yaml
  - templates/kiali/values.yaml
  - templates/package/helmrelease.yaml
release:
  name: test
tests:
  - it: should treat a null package configuration as unversioned
    set:
      packageConfiguration:
    asserts:
      - notFailedTemplate: {}

  - it: should preserve the 3.x custom-package meaning without an explicit version
    set:
      kiali:
        enabled: false
      packages:
        kiali:
          enabled: true
          sourceType: git
          git:
            repo: https://example.com/custom-kiali.git
            path: custom-chart
            tag: v1
    asserts:
      - hasDocuments:
          count: 0
        template: templates/kiali/helmrelease.yaml
      - equal:
          path: metadata.name
          value: kiali
        template: templates/package/helmrelease.yaml
      - equal:
          path: spec.chart.spec.chart
          value: custom-chart
        template: templates/package/helmrelease.yaml

  - it: should interpret catalog names as built-ins after opting into v1
    set:
      kiali:
        enabled: false
      packageConfiguration:
        version: v1
      packages:
        kiali:
          enabled: true
          git:
            repo: https://example.com/canonical-kiali.git
            path: chart
            tag: v1
    asserts:
      - equal:
          path: metadata.name
          value: kiali
        template: templates/kiali/helmrelease.yaml
      - hasDocuments:
          count: 0
        template: templates/package/helmrelease.yaml

  - it: should reject unsupported package configuration versions
    set:
      packageConfiguration:
        version: v2
    asserts:
      - failedTemplate:
          errorPattern: ".*packageConfiguration/version.*must be 'v1'.*"
