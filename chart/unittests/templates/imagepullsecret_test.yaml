# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Templates - Common Registry Secret Resources
tests:
  - it: should not render a registry Secret without credentials
    template: argocd/imagepullsecret.yaml
    set:
      addons:
        argocd:
          enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: should preserve a package registry Secret metadata and type
    template: tempo/imagepullsecret.yaml
    set:
      registryCredentials:
        registry: registry1.dso.mil
        username: test
        password: test
      tempo:
        enabled: true
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: private-registry
      - equal:
          path: metadata.namespace
          value: tempo
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: tempo
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: core
      - equal:
          path: type
          value: kubernetes.io/dockerconfigjson
      - exists:
          path: data[".dockerconfigjson"]
