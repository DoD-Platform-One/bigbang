# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Wrapper Values Tests
templates:
  - templates/wrapper/values.yaml
release:
  name: test
set:
  packages:
    example:
      enabled: true
      sourceType: git
      git:
        repo: https://example.com/example.git
        path: chart
        tag: 1.0.0
      wrapper:
        enabled: true
postRenderer:
  cmd: "sh"
  args:
    - "-c"
    - "yq eval '.stringData[\"values.yaml\"]' - | yq eval '.'"
tests:
  - it: passes ambient mode to wrapper values
    set:
      istio:
        ambient:
          enabled: true
    asserts:
      - equal:
          path: bigbang.istio.ambient.enabled
          value: true

  - it: passes calculated ambient mode when ztunnel is enabled
    set:
      istio:
        ambient:
          enabled: false
      ztunnel:
        enabled: true
    asserts:
      - equal:
          path: bigbang.istio.ambient.enabled
          value: true

  - it: retains the existing Istio enabled passdown
    set:
      istio:
        enabled: true
    asserts:
      - equal:
          path: bigbang.istio.enabled
          value: true
