# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Templates - Common Namespace Resources
tests:
  - it: should select sidecar-injection labels in auto mode
    template: argocd/namespace.yaml
    set:
      istiod:
        enabled: true
      addons:
        argocd:
          enabled: true
          istio:
            injection: enabled
    asserts:
      - isKind:
          of: Namespace
      - equal:
          path: metadata.name
          value: argocd
      - equal:
          path: metadata.labels["istio-injection"]
          value: enabled

  - it: should disable sidecar injection in auto mode when Istio is globally disabled
    template: argocd/namespace.yaml
    set:
      istiod:
        enabled: false
      addons:
        argocd:
          enabled: true
          istio:
            injection: enabled
    asserts:
      - equal:
          path: metadata.labels["istio-injection"]
          value: disabled
      - notExists:
          path: metadata.labels["istio.io/dataplane-mode"]

  - it: should select ambient labels in auto mode
    template: argocd/namespace.yaml
    set:
      istio:
        ambient:
          enabled: true
      addons:
        argocd:
          enabled: true
    asserts:
      - equal:
          path: metadata.labels["istio.io/dataplane-mode"]
          value: ambient
      - notExists:
          path: metadata.labels["istio-injection"]

  - it: should select ambient labels in auto mode when ztunnel is enabled
    template: argocd/namespace.yaml
    set:
      ztunnel:
        enabled: true
      addons:
        argocd:
          enabled: true
    asserts:
      - equal:
          path: metadata.labels["istio.io/dataplane-mode"]
          value: ambient
      - notExists:
          path: metadata.labels["istio-injection"]

  - it: should keep Gatekeeper out of the mesh and preserve additional labels
    template: gatekeeper/namespace.yaml
    set:
      gatekeeper:
        enabled: true
    asserts:
      - equal:
          path: metadata.labels["istio-injection"]
          value: disabled
      - equal:
          path: metadata.labels["istio.io/dataplane-mode"]
          value: none
      - equal:
          path: metadata.labels["admission.gatekeeper.sh/ignore"]
          value: no-self-managing
      - equal:
          path: metadata.labels["gatekeeper.sh/system"]
          value: "yes"

  - it: should enroll the Renovate Namespace in ambient mode
    template: renovate/namespace.yaml
    set:
      istio:
        ambient:
          enabled: true
      renovate:
        enabled: true
    asserts:
      - equal:
          path: metadata.labels["istio.io/dataplane-mode"]
          value: ambient
      - notExists:
          path: metadata.labels["istio-injection"]

  - it: should fail when the Namespace name is missing
    template: templates/_self-test/render.yaml
    set:
      _selfTest:
        bigbang.namespace:
          args:
            appName: test
    asserts:
      - failedTemplate:
          errorMessage: "bigbang.namespace: name is required"

  - it: should fail when the application name is missing
    template: templates/_self-test/render.yaml
    set:
      _selfTest:
        bigbang.namespace:
          args:
            name: test
    asserts:
      - failedTemplate:
          errorMessage: "bigbang.namespace: appName is required"

  - it: should fail when meshMode is not a string
    template: templates/_self-test/render.yaml
    set:
      _selfTest:
        bigbang.namespace:
          args:
            root: helm:context
            name: test
            appName: test
            meshMode: 1
    asserts:
      - failedTemplate:
          errorMessage: 'bigbang.namespace: meshMode for namespace "test" must be a string, got float64'

  - it: should fail when meshMode is unsupported
    template: templates/_self-test/render.yaml
    set:
      _selfTest:
        bigbang.namespace:
          args:
            root: helm:context
            name: test
            appName: test
            meshMode: invalid
    asserts:
      - failedTemplate:
          errorMessage: 'bigbang.namespace: unsupported meshMode "invalid" for namespace "test"; expected one of: auto, none'
