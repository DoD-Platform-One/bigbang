# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Packages - GitLab CI External Dependencies - Ambient
templates:
  - templates/package/helmrelease.yaml
  - templates/package/namespace.yaml
  - templates/package/values.yaml
  - templates/wrapper/helmrelease.yaml
  - templates/wrapper/values.yaml
release:
  name: test
  namespace: bigbang
values:
  - ../../../../tests/test-values.yaml
  - ../../../../tests/test-values-ambient.yaml
set:
  addons.gitlab.enabled: true
  packages.cloudnative-pg.enabled: true
  packages.postgresql.enabled: true
  packages.redis.enabled: true
  packages.garage.enabled: true
tests:
  - it: waits for the complete ambient mesh before installing Garage
    template: package/helmrelease.yaml
    documentSelector:
      path: metadata.name
      value: garage
    asserts:
      - equal:
          path: spec.dependsOn
          value:
            - name: kyverno-policies
              namespace: bigbang
            - name: istiod
              namespace: bigbang
            - name: istio-cni
              namespace: bigbang
            - name: ztunnel
              namespace: bigbang

  - it: waits for the ambient mesh before installing the CloudNativePG operator
    template: package/helmrelease.yaml
    documentSelector:
      path: metadata.name
      value: cloudnative-pg
    asserts:
      - contains:
          path: spec.dependsOn
          content:
            name: istio-cni
            namespace: bigbang
      - contains:
          path: spec.dependsOn
          content:
            name: ztunnel
            namespace: bigbang

  - it: waits for the operator and ambient mesh before installing PostgreSQL
    template: package/helmrelease.yaml
    documentSelector:
      path: metadata.name
      value: postgresql
    asserts:
      - equal:
          path: spec.targetNamespace
          value: postgresql
      - contains:
          path: spec.dependsOn
          content:
            name: cloudnative-pg
            namespace: bigbang
      - contains:
          path: spec.dependsOn
          content:
            name: istiod
            namespace: bigbang
      - contains:
          path: spec.dependsOn
          content:
            name: istio-cni
            namespace: bigbang
      - contains:
          path: spec.dependsOn
          content:
            name: ztunnel
            namespace: bigbang
      - equal:
          path: spec.waitStrategy.name
          value: poller
      - equal:
          path: spec.healthCheckExprs[0].kind
          value: Cluster

  - it: preserves Redis wrapper ordering while waiting for ambient
    template: package/helmrelease.yaml
    documentSelector:
      path: metadata.name
      value: redis
    asserts:
      - contains:
          path: spec.dependsOn
          content:
            name: ztunnel
            namespace: bigbang

  - it: enrolls each dependency namespace in ambient
    template: package/namespace.yaml
    documentSelector:
      path: metadata.name
      value: postgresql
    asserts:
      - equal:
          path: metadata.labels["istio.io/dataplane-mode"]
          value: ambient
      - notExists:
          path: metadata.labels.istio-injection

  - it: retains ambient mTLS and generated AuthorizationPolicies for Garage
    template: package/values.yaml
    documentSelector:
      path: metadata.name
      value: garage-values
    asserts:
      - matchRegex:
          path: stringData["values.yaml"]
          pattern: "mode: STRICT"
      - matchRegex:
          path: stringData["values.yaml"]
          pattern: "(?s)authorizationPolicies:.*enabled: true.*generateFromNetpol: true"

  - it: permits ambient HBONE ingress through the PostgreSQL wrapper policies
    template: package/values.yaml
    documentSelector:
      path: metadata.name
      value: postgresql-values
    asserts:
      - matchRegex:
          path: stringData["values.yaml"]
          pattern: "(?s)allow-gitlab-postgresql.*port: 5432.*port: 15008"
      - matchRegex:
          path: stringData["values.yaml"]
          pattern: "(?s)allow-cloudnative-pg-status.*port: 8000.*port: 15008"
      - matchRegex:
          path: stringData["values.yaml"]
          pattern: "(?s)allow-cnpg-kube-api.*cidr: ['\"]?172.16.0.0/12['\"]?.*cnpg.io/cluster: postgresql"

  - it: enables the wrapper's selector-scoped ambient authorization policy
    template: package/values.yaml
    documentSelector:
      path: metadata.name
      value: postgresql-values
    asserts:
      - matchRegex:
          path: stringData["values.yaml"]
          pattern: "(?s)customAuthorizationPolicies:.*name: allow-gitlab-postgresql.*namespaces:.*- postgresql.*- gitlab.*ports:.*- ['\"]?5432['\"]?.*cnpg.io/cluster: postgresql"
      - matchRegex:
          path: stringData["values.yaml"]
          pattern: "(?s)principals:.*cluster.local/ns/cloudnative-pg/sa/cloudnative-pg.*ports:.*- ['\"]?8000['\"]?"

  - it: enables ambient and HBONE policy port injection in generated common values
    template: package/values.yaml
    documentSelector:
      path: metadata.name
      value: garage-values
    asserts:
      - matchRegex:
          path: stringData["common.yaml"]
          pattern: "(?s)ambient:.*enabled: true"
      - matchRegex:
          path: stringData["common.yaml"]
          pattern: "(?s)hbonePortInjection:.*enabled: true"
