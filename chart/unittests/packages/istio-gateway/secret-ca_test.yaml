# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Package - Istio Gateway - CA Cert Secret Tests
templates:
  - templates/istio-gateway/secret-ca.yaml
release:
  name: bb
tests:
  - it: should create a CA secret for the Keycloak OPTIONAL_MUTUAL server on the public gateway
    set:
      addons.keycloak.enabled: true
    asserts:
      - containsDocument:
          apiVersion: v1
          kind: Secret
          name: public-cert-cacert
          namespace: istio-gateway
      - equal:
          path: type
          value: Opaque
      - isNotNull:
          path: data.cacert
        documentSelector:
          path: metadata.name
          value: public-cert-cacert

  - it: should not create a CA secret when the public gateway has no Keycloak OPTIONAL_MUTUAL server
    asserts:
      - hasDocuments:
          count: 0

  - it: should not create a CA secret for Keycloak on a custom gateway
    set:
      addons.keycloak.enabled: true
      addons.keycloak.ingress.gateway: custom
      istioGateway.values.gateways.custom:
        gateway:
          servers:
            - hosts:
                - keycloak.dev.bigbang.mil
              port:
                name: https-keycloak
                number: 8443
                protocol: HTTPS
              tls:
                credentialName: custom-cert
                mode: OPTIONAL_MUTUAL
        upstream:
          labels:
            istio: ingressgateway
    asserts:
      - hasDocuments:
          count: 0

  - it: should not create a CA secret for an unrelated OPTIONAL_MUTUAL server on the public gateway
    set:
      istioGateway.values.gateways.public.gateway.servers:
        - hosts:
            - other.dev.bigbang.mil
          port:
            name: https-other
            number: 8443
            protocol: HTTPS
          tls:
            credentialName: other-cert
            mode: OPTIONAL_MUTUAL
    asserts:
      - hasDocuments:
          count: 0
