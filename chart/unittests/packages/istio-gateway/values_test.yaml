# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Package - Istio Gateway - Values Tests
templates:
  - templates/istio-gateway/values.yaml
release:
  name: bb
tests:
  - it: should not add overlays when no shared or gateway-specific values are configured
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval 'select(.metadata.name == \"bb-istio-public-gateway-values\") | .stringData.overlays' - | yq eval '.'"
    asserts:
      - notExists:
          path: upstream

  - it: should apply shared values to the public gateway overlays
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval 'select(.metadata.name == \"bb-istio-public-gateway-values\") | .stringData.overlays' - | yq eval '.'"
    set:
      istioGateway.values:
        shared:
          waitJob:
            enabled: false
          networkPolicies:
            enabled: false
          mtls:
            mode: PERMISSIVE
          upstream:
            service:
              type: ClusterIP
    asserts:
      - equal:
          path: waitJob.enabled
          value: false
      - equal:
          path: networkPolicies.enabled
          value: false
      - equal:
          path: mtls.mode
          value: PERMISSIVE
      - equal:
          path: upstream.service.type
          value: ClusterIP

  - it: should apply shared values to the passthrough gateway overlays
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval 'select(.metadata.name == \"bb-istio-passthrough-gateway-values\") | .stringData.overlays' - | yq eval '.'"
    set:
      istioGateway.values:
        shared:
          waitJob:
            enabled: false
          mtls:
            mode: PERMISSIVE
    asserts:
      - equal:
          path: waitJob.enabled
          value: false
      - equal:
          path: mtls.mode
          value: PERMISSIVE

  - it: should let gateway-specific values override shared values
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval 'select(.metadata.name == \"bb-istio-public-gateway-values\") | .stringData.overlays' - | yq eval '.'"
    set:
      istioGateway.values:
        shared:
          waitJob:
            enabled: false
        gateways:
          public:
            waitJob:
              enabled: true
    asserts:
      - equal:
          path: waitJob.enabled
          value: true

  - it: should add a keycloak OPTIONAL_MUTUAL server block to the public gateway when keycloak is enabled without a cert/key
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval 'select(.metadata.name == \"bb-istio-public-gateway-values\") | .stringData.defaults' - | yq eval '.'"
    set:
      addons.keycloak.enabled: true
    asserts:
      - equal:
          path: gateway.servers[2].hosts[0]
          value: keycloak.dev.bigbang.mil
      - equal:
          path: gateway.servers[2].tls.mode
          value: OPTIONAL_MUTUAL
      - equal:
          path: gateway.servers[2].tls.credentialName
          value: public-cert

  - it: should not add a keycloak server block to the public gateway when keycloak is disabled
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval 'select(.metadata.name == \"bb-istio-public-gateway-values\") | .stringData.defaults' - | yq eval '.'"
    asserts:
      - lengthEqual:
          path: gateway.servers
          count: 2

  - it: should not add a keycloak server block to the public gateway when keycloak uses a custom gateway
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval 'select(.metadata.name == \"bb-istio-public-gateway-values\") | .stringData.defaults' - | yq eval '.'"
    set:
      addons.keycloak.enabled: true
      addons.keycloak.ingress.gateway: custom
    asserts:
      - lengthEqual:
          path: gateway.servers
          count: 2
