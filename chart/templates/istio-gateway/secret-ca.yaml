{{- /*
  Create a <credentialName>-cacert Opaque secret for the Keycloak OPTIONAL_MUTUAL server block on the public gateway.
*/ -}}
{{- if and .Values.istiod.enabled .Values.istioGateway.enabled }}
{{- $enabledGateways := include "enabledGateways" . | fromYaml -}}
{{- $optionalMutualCredentials := dict -}}
{{- $keycloakHost := printf "keycloak.%s" .Values.domain -}}
{{- with get $enabledGateways "public" -}}
  {{- $effectiveGateway := mergeOverwrite (deepCopy (dig "defaults" dict .)) (deepCopy (dig "overlays" dict .)) -}}
  {{- range $server := (dig "gateway" "servers" list $effectiveGateway) -}}
    {{- $tlsMode := dig "tls" "mode" "" $server -}}
    {{- $hosts := dig "hosts" list $server -}}
    {{- if and (eq $tlsMode "OPTIONAL_MUTUAL") (has $keycloakHost $hosts) -}}
      {{- with dig "tls" "credentialName" "" $server -}}
        {{- $_ := set $optionalMutualCredentials . "public" -}}
      {{- end -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
{{- if $optionalMutualCredentials }}
{{- $caBundle := $.Files.Get "ca-certs/dod-bundle.pem" -}}
{{- if not $caBundle -}}
  {{- fail "istio-gateway: the Keycloak OPTIONAL_MUTUAL server block is defined on the public gateway but ca-certs/dod-bundle.pem is missing" -}}
{{- end -}}
{{- range $credentialName, $gatewayName := $optionalMutualCredentials }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $credentialName }}-cacert
  namespace: istio-gateway
  labels:
    app.kubernetes.io/name: istio-gateway-{{ $gatewayName }}
    app.kubernetes.io/component: core
    {{- include "commonLabels" $ | nindent 4 }}
type: Opaque
data:
  cacert: {{ $caBundle | b64enc }}
{{- end }}
{{- end }}
{{- end }}
