{{- include "bigbang.normalizePackageAliases" . -}}
{{- if .Values.addons.gitlab.enabled }}
{{- $objectStorageValues := .Values.addons.gitlab.objectStorage -}}
{{- range $endpointName := list "endpoint" "regionendpoint" -}}
  {{- $endpointValue := get $objectStorageValues $endpointName -}}
  {{- if and (not (empty $endpointValue)) (not (regexMatch "^https?://" ($endpointValue | toString))) -}}
    {{- fail (printf "addons.gitlab.objectStorage.%s must begin with http:// or https:// when set" $endpointName) -}}
  {{- end -}}
{{- end -}}
{{- $gitlabPackage := deepCopy .Values.addons.gitlab -}}
{{- if .Values.addons.gitlab.values -}}
{{- $cleanedValues := include "mergeLegacyIstioHardenedKeys" (dict "values" .Values.addons.gitlab.values) | fromYaml -}}
{{- $gitlabPackage = set $gitlabPackage "values" $cleanedValues -}}
{{- end -}}
{{- include "values-secret" (dict 
  "root" $ 
  "package" $gitlabPackage 
  "name" "gitlab" 
  "defaults" ((mergeOverwrite (include "bigbang.defaults.gitlab" . | fromYaml) (include "bigbang.gitlab.bb-common-migrations" . | fromYaml)) | toYaml)
)}}
{{- end }}
{{- if and (ne .Values.addons.gitlab.objectStorage.iamProfile "") (ne .Values.addons.gitlab.objectStorage.accessKey "") }}{{- fail "Must choose to use an IAM profile OR an AWS accessKey/accessSecret at .Values.addons.gitlab.objectStorage" }}{{- end }}
{{- define "bigbang.defaults.gitlab" -}}
# hostname is deprecated and replaced with domain. But if hostname exists then use it.
{{- $domainName := default .Values.domain .Values.hostname }}
hostname: {{ $domainName }}
domain: {{ $domainName }}

# Define variables to help with conditionals later
{{- $istioEnabled := eq (include "istioEnabled" .) "true" }}
{{- $istioInjection := and $istioEnabled (ne (include "ambientEnabled" .) "true") (eq (dig "istio" "injection" "enabled" .Values.addons.gitlab) "enabled") }}
{{- $extObjStorageIsConfigured := (or .Values.addons.gitlab.objectStorage.region .Values.addons.gitlab.objectStorage.endpoint) }}
{{- $consolidatedObjStoreEnabled := dig "global" "appConfig" "object_store" "enabled" false .Values.addons.gitlab.values }}
{{- $iamProfile := (and (ne .Values.addons.gitlab.objectStorage.iamProfile "") $extObjStorageIsConfigured) }}
{{- $kasEnabled := dig "global" "kas" "enabled" false .Values.addons.gitlab.values }}
{{- $externalRedisConfigured := eq (include "bigbang.gitlab.externalRedisConfigured" .) "true" }}
{{- $externalPostgresConfigured := eq (include "bigbang.gitlab.externalPostgresConfigured" .) "true" }}
{{- $gitlabGlobalValues := (get .Values.addons.gitlab.values "global") | default dict }}
{{- $gitlabRedisValues := dict }}
{{- $gitlabPsqlValues := dict }}
{{- if kindIs "map" $gitlabGlobalValues }}
  {{- $configuredRedisValues := (get $gitlabGlobalValues "redis") | default dict }}
  {{- if kindIs "map" $configuredRedisValues }}
    {{- $gitlabRedisValues = $configuredRedisValues }}
  {{- end }}
  {{- $configuredPsqlValues := (get $gitlabGlobalValues "psql") | default dict }}
  {{- if kindIs "map" $configuredPsqlValues }}
    {{- $gitlabPsqlValues = $configuredPsqlValues }}
  {{- end }}
{{- end }}
{{- $gitlabEgressDefinitions := deepCopy .Values.networkPolicies.egress.definitions }}
{{- if $externalPostgresConfigured }}
  {{- $databaseDefinition := (get $gitlabEgressDefinitions "database-subnets") | default dict }}
  {{- if or (not (kindIs "map" $databaseDefinition)) (empty $databaseDefinition) }}
    {{- $databaseDefinition = dict
      "to" (list
        (dict "ipBlock" (dict "cidr" "192.168.0.0/16"))
        (dict "ipBlock" (dict "cidr" "172.16.0.0/12"))
        (dict "ipBlock" (dict "cidr" "10.0.0.0/8")))
      "ports" (list (dict "port" 5432 "protocol" "TCP")) }}
  {{- end }}
  {{- $databasePorts := (get $databaseDefinition "ports") | default list }}
  {{- if not (kindIs "slice" $databasePorts) }}
    {{- $databasePorts = list }}
  {{- end }}
  {{- $databasePortNumbers := list }}
  {{- range $entry := $databasePorts }}
    {{- if kindIs "map" $entry }}
      {{- if hasKey $entry "port" }}
        {{- $databasePortNumbers = append $databasePortNumbers ((get $entry "port") | int) }}
      {{- end }}
    {{- end }}
  {{- end }}
  {{- $configuredDatabasePorts := list }}
  {{- if not (empty .Values.addons.gitlab.database.host) }}
    {{- $configuredDatabasePorts = append $configuredDatabasePorts (.Values.addons.gitlab.database.port | default 5432 | int) }}
  {{- end }}
  {{- if or (not (empty (get $gitlabPsqlValues "host"))) (not (empty (get $gitlabPsqlValues "port"))) }}
    {{- $configuredDatabasePorts = append $configuredDatabasePorts ((get $gitlabPsqlValues "port") | default 5432 | int) }}
  {{- end }}
  {{- range $databaseName := list "main" "ci" "embedding" "sec" }}
    {{- $databaseValues := (get $gitlabPsqlValues $databaseName) | default dict }}
    {{- if kindIs "map" $databaseValues }}
      {{- $databasePort := get $databaseValues "port" }}
      {{- if or (not (empty $databasePort)) (and (eq $databaseName "main") (not (empty (get $databaseValues "host")))) }}
        {{- $configuredDatabasePorts = append $configuredDatabasePorts ($databasePort | default 5432 | int) }}
      {{- end }}
    {{- end }}
  {{- end }}
  {{- range $configuredDatabasePort := $configuredDatabasePorts }}
    {{- if not (has $configuredDatabasePort $databasePortNumbers) }}
      {{- $databasePorts = append $databasePorts (dict "port" $configuredDatabasePort "protocol" "TCP") }}
      {{- $databasePortNumbers = append $databasePortNumbers $configuredDatabasePort }}
    {{- end }}
  {{- end }}
  {{- $_ := set $databaseDefinition "ports" $databasePorts }}
  {{- $_ := set $gitlabEgressDefinitions "database-subnets" $databaseDefinition }}
{{- end }}
{{- if $externalRedisConfigured }}
  {{- $redisDefinition := (get $gitlabEgressDefinitions "redis-subnets") | default dict }}
  {{- if or (not (kindIs "map" $redisDefinition)) (empty $redisDefinition) }}
    {{- $redisDefinition = dict
      "to" (list
        (dict "ipBlock" (dict "cidr" "192.168.0.0/16"))
        (dict "ipBlock" (dict "cidr" "172.16.0.0/12"))
        (dict "ipBlock" (dict "cidr" "10.0.0.0/8")))
      "ports" (list (dict "port" 6379 "protocol" "TCP")) }}
  {{- end }}
  {{- $redisPorts := (get $redisDefinition "ports") | default list }}
  {{- $redisPortNumbers := list }}
  {{- range $entry := $redisPorts }}
    {{- if kindIs "map" $entry }}
      {{- $redisPortNumbers = append $redisPortNumbers ((get $entry "port") | int) }}
    {{- end }}
  {{- end }}
  {{- $configuredRedisPort := get $gitlabRedisValues "port" }}
  {{- if not (empty $configuredRedisPort) }}
    {{- $configuredRedisPort = int $configuredRedisPort }}
    {{- if not (has $configuredRedisPort $redisPortNumbers) }}
      {{- $redisPorts = append $redisPorts (dict "port" $configuredRedisPort "protocol" "TCP") }}
      {{- $redisPortNumbers = append $redisPortNumbers $configuredRedisPort }}
    {{- end }}
  {{- end }}
  {{- range $sentinel := (get $gitlabRedisValues "sentinels") | default list }}
    {{- if kindIs "map" $sentinel }}
      {{- $sentinelPort := (get $sentinel "port") | default 26379 | int }}
      {{- if not (has $sentinelPort $redisPortNumbers) }}
        {{- $redisPorts = append $redisPorts (dict "port" $sentinelPort "protocol" "TCP") }}
        {{- $redisPortNumbers = append $redisPortNumbers $sentinelPort }}
      {{- end }}
    {{- end }}
  {{- end }}
  {{- $_ := set $redisDefinition "ports" $redisPorts }}
  {{- $_ := set $gitlabEgressDefinitions "redis-subnets" $redisDefinition }}
{{- else }}
  {{- $_ := unset $gitlabEgressDefinitions "redis-subnets" }}
{{- end }}

openshift: {{ .Values.openshift }}

routes:
  inbound:
    gitlab:
      enabled: true
      gateways:
      - istio-gateway/public-ingressgateway
      hosts:
      - gitlab.{{ .Values.domain }}
      http:
      - fault:
          abort:
            httpStatus: 403
            percentage:
              value: 100
        match:
        - uri:
            prefix: /-/metrics
        route:
        - destination:
            host: gitlab-webservice-default
            port:
              number: 8181
      - match:
        - uri:
            prefix: /
        route:
        - destination:
            host: gitlab-webservice-default
            port:
              number: 8181
      - match:
        - uri:
            prefix: /admin/sidekiq
        route:
        - destination:
            host: gitlab-webservice-default
            port:
              number: 8080
      selector:
        app: webservice

    registry:
      enabled: false
      gateways:
      - istio-gateway/public-ingressgateway
      hosts:
      - registry.{{ .Values.domain }}
      service: gitlab-registry
      port: 5000
      selector:
        app: registry
    {{- if $kasEnabled }}
    kas:
      enabled: {{ dig "global" "kas" "enabled" true .Values.addons.gitlab.values }}
      gateways:
      - istio-gateway/public-ingressgateway
      hosts:
      - kas.{{ .Values.domain }}
      http:
      - match:
        - uri:
            prefix: /-/kubernetes-agent
        route:
        - destination:
            host: gitlab-kas
            port:
              number: 8150
      selector:
        app: kas
    {{- end }}

    pages:
      enabled: false
      service: gitlab-pages
      port: 8090
      selector:
        app: gitlab-pages
  outbound:
    bb-tests:
      enabled: {{ dig "bbtests" "enabled" false .Values.addons.gitlab.values }}
      hosts:
      - 'repo1.dso.mil'
      - 'registry1.dso.mil'
      - 'ib-prod-harbor-storage.s3.us-gov-west-1.amazonaws.com'
      - 'ib-prod-harbor-storage.s3.us-gov-east-1.amazonaws.com'
      - registry.{{ $domainName }}
      - keycloak.{{ $domainName }}

{{- $istioHardened := dig "hardened" "enabled" false .Values.istiod.values }}
istio:
  enabled: {{ $istioEnabled }}
  sidecar:
    enabled: {{ and $istioHardened (ne (include "ambientEnabled" .) "true") }}
  ambient:
    enabled: {{ include "ambientEnabled" . }}
  authorizationPolicies:
    enabled: {{ include "authorizationPoliciesEnabled" (list .Values.addons.gitlab.values .) }}
    generateFromNetpol: {{ include "authorizationPoliciesEnabled" (list .Values.addons.gitlab.values .) }}

networkPolicies:
  enabled: {{ include "networkPoliciesEnabled" . }}
  hbonePortInjection:
    enabled: {{ include "ambientEnabled" . }}
  ingress:
    definitions: {{ toYaml .Values.networkPolicies.ingress.definitions | nindent 6 }}
    to:
      redis:9121: 
        from:
          k8s:
            alloy-alloy-metrics@alloy/alloy-metrics: {{ dig "alloyMetrics" "enabled" false .Values.alloy }}
            monitoring-monitoring-kube-prometheus@monitoring/prometheus: {{ and .Values.monitoring.enabled (dig "redis" "install" true .Values.addons.gitlab.values) }}
      gitlab-exporter:9168:
        podSelector:
          matchLabels:
            app: gitlab-exporter
        from:
          k8s:
            alloy-alloy-metrics@alloy/alloy-metrics: {{ dig "alloyMetrics" "enabled" false .Values.alloy }}
            monitoring-monitoring-kube-prometheus@monitoring/prometheus: {{ and .Values.monitoring.enabled }}
      gitaly:9236:
        podSelector:
          matchLabels:
            app: gitaly
        from:
          k8s:
            alloy-alloy-metrics@alloy/alloy-metrics: {{ dig "alloyMetrics" "enabled" false .Values.alloy }}
            monitoring-monitoring-kube-prometheus@monitoring/prometheus: {{ and .Values.monitoring.enabled }}
      webservice:8181:
        podSelector:
          matchLabels:
            app: webservice
        from:
          k8s:
            # Allow any service account from the gitlab-runner namespace; the runner 
            # coordinator has a different service account to the jobs it runs
            gitlab-runner/gitlab-runner: 
              enabled: {{ .Values.addons.gitlabRunner.enabled }}
              podSelector:
                matchLabels:
                  app: gitlab-runner
      webservice:[8083,8084,9229]:
        podSelector:
          matchLabels:
            app: webservice
        from:
          k8s:
            alloy-alloy-metrics@alloy/alloy-metrics: {{ dig "alloyMetrics" "enabled" false .Values.alloy }}
            monitoring-monitoring-kube-prometheus@monitoring/prometheus: {{ and .Values.monitoring.enabled }}

      registry:5001:
        podSelector:
          matchLabels:
            app: registry
        from:
          k8s:
            alloy-alloy-metrics@alloy/alloy-metrics: {{ dig "alloyMetrics" "enabled" false .Values.alloy }}
            monitoring-monitoring-kube-prometheus@monitoring/prometheus: {{ and .Values.monitoring.enabled }}
      {{- if $kasEnabled }}
      kas:[8150,8153]:
        podSelector:
          matchLabels:
            app: kas
        from:
          k8s:
            alloy-alloy-metrics@alloy/alloy-metrics: {{ dig "alloyMetrics" "enabled" false .Values.alloy }}
            monitoring-monitoring-kube-prometheus@monitoring/prometheus: {{ and .Values.monitoring.enabled }}
      {{- end }}

      gitlab-runner:9252:
        podSelector:
          matchLabels:
            app: gitlab-runner
        from:
          k8s:
            alloy-alloy-metrics@alloy/alloy-metrics: {{ dig "alloyMetrics" "enabled" false .Values.alloy }}
            monitoring-monitoring-kube-prometheus@monitoring/prometheus: {{ and .Values.monitoring.enabled }}
  egress:
    definitions: {{ toYaml $gitlabEgressDefinitions | nindent 6 }}
    from:
      "*":
        to:
          definition:
            kubeAPI: true
          k8s:
            tempo/tempo:9411: {{ .Values.tempo.enabled }}
      sidekiq:
        to:
          definition:
            storage-subnets: true
            {{- if $externalRedisConfigured }}
            redis-subnets: true
            {{- end }}
      webservice:
        to:
          definition:
            sso: true
            database-subnets: true
            {{- if $externalRedisConfigured }}
            redis-subnets: true
            {{- end }}
      migrations:
        to:
          definition:
            database-subnets: true
            {{- if $externalRedisConfigured }}
            redis-subnets: true
            {{- end }}
      {{- if $externalRedisConfigured }}
      toolbox:
        to:
          definition:
            redis-subnets: true
      {{- end }}
      {{- if eq (include "metricScrapingEnabled" .) "true" }}
      gitlab-exporter:
        podSelector:
          matchLabels:
            app: gitlab-exporter
        to:
          definition:
            {{- if $externalRedisConfigured }}
            redis-subnets: true
            {{- end }}
      {{- end }}
      {{- if and $externalRedisConfigured $kasEnabled }}
      kas:
        to:
          definition:
            redis-subnets: true
      {{- end }}
      {{- if and $externalRedisConfigured (dig "upstream" "gitlab" "mailroom" "enabled" false .Values.addons.gitlab.values) }}
      mailroom:
        podSelector:
          matchLabels:
            app: mailroom
        to:
          definition:
            redis-subnets: true
      {{- end }}

bbtests:
  enableImagePullSecrets: {{ ne .Values.registryCredentials nil }}
  cypress:
    envs:
      cypress_url: {{ printf "https://gitlab.%s" $domainName | quote }}
  scripts:
    envs:
      GITLAB_REGISTRY: registry.{{ $domainName }}

upstream:
  {{- if and (or $istioEnabled .Values.monitoring.enabled) (dig "redis" "install" true .Values.addons.gitlab.values) }}
  redis:
    {{- if eq (include "metricScrapingEnabled" .) "true" }}
    metrics:
      serviceMonitor:
        enabled: true
        namespace: gitlab
    {{- end }}
    {{- if $istioEnabled }}
    master:
      podAnnotations:
        {{ include "istioAnnotation" . }}
    replica:
      podAnnotations:
        {{ include "istioAnnotation" . }}
    {{- end }}
  {{- end }}

  {{- if or .Values.addons.gitlab.database.host $istioEnabled }}
  postgresql:
    {{- if .Values.addons.gitlab.database.host }}
    install: false
    {{- end }}
    {{- if $istioEnabled }}
    primary:
      podAnnotations:
        {{ include "istioAnnotation" . }}
    readReplicas:
      podAnnotations:
        {{ include "istioAnnotation" . }}
    {{- end }}
  {{- end }}

  {{- if or $extObjStorageIsConfigured $istioEnabled }}
  registry:
    {{- if $extObjStorageIsConfigured }}
    storage:
      secret: gitlab-object-storage
      key: registry
    {{- end }}
    {{- if or $iamProfile $istioEnabled }}
    annotations: 
      {{- if $iamProfile }}
      iam.amazonaws.com/role: {{ .Values.addons.gitlab.objectStorage.iamProfile }}
      {{- end }}
      {{- if $istioEnabled }}
      {{ include "istioAnnotation" . }}
      {{- end }}
    {{- end }}
    {{- if eq (include "metricsSidecarMtls" (list .Values.addons.gitlab .)) "true" }}
    metrics:
      serviceMonitor:
        endpointConfig:
          scheme: https
          tlsConfig:
            caFile: /etc/prom-certs/root-cert.pem
            certFile: /etc/prom-certs/cert-chain.pem
            keyFile: /etc/prom-certs/key.pem
            insecureSkipVerify: true  # Prometheus does not support Istio security naming, thus skip verifying target pod certificate
    {{- end }}
  {{- end }}

  gitlab:
    {{- if or $extObjStorageIsConfigured $istioEnabled }}
    toolbox:
      {{- if $extObjStorageIsConfigured }}
      backups:
        objectStorage:
          config:
            secret: gitlab-object-storage
            key: backups
      {{- end }}
      {{- if or $iamProfile $istioEnabled }}
      annotations:
        {{- if $iamProfile }}
        iam.amazonaws.com/role: {{ .Values.addons.gitlab.objectStorage.iamProfile }}
        {{- end }}
        {{- if $istioEnabled }}
        {{ include "istioAnnotation" . }}
        {{- end }}
      {{- end }}
    {{- end }}
    gitlab-exporter:
      enabled: {{ eq (include "metricScrapingEnabled" .) "true" }}
      {{- if $istioEnabled }}
      metrics:
        annotations:
          {{ include "istioAnnotation" . }}
      {{- end }}
      {{- if eq (include "metricsSidecarMtls" (list .Values.addons.gitlab .)) "true" }}
      metrics:
        serviceMonitor:
          endpointConfig:
            scheme: https
            tlsConfig:
              caFile: /etc/prom-certs/root-cert.pem
              certFile: /etc/prom-certs/cert-chain.pem
              keyFile: /etc/prom-certs/key.pem
              insecureSkipVerify: true  # Prometheus does not support Istio security naming, thus skip verifying target pod certificate
      {{- end }}

    {{- if or $iamProfile $istioEnabled }}
    webservice:
    {{- if eq (include "metricsSidecarMtls" (list .Values.addons.gitlab .)) "true" }}
      metrics:
        serviceMonitor:
          endpointConfig:
            scheme: https
            tlsConfig:
              caFile: /etc/prom-certs/root-cert.pem
              certFile: /etc/prom-certs/cert-chain.pem
              keyFile: /etc/prom-certs/key.pem
              insecureSkipVerify: true  # Prometheus does not support Istio security naming, thus skip verifying target pod certificate
      workhorse:
        metrics:
          serviceMonitor:
            endpointConfig:
              scheme: https
              tlsConfig:
                caFile: /etc/prom-certs/root-cert.pem
                certFile: /etc/prom-certs/cert-chain.pem
                keyFile: /etc/prom-certs/key.pem
                insecureSkipVerify: true  # Prometheus does not support Istio security naming, thus skip verifying target pod certificate
    {{- end }}
    {{- if or $iamProfile $istioEnabled }}
      annotations: 
        {{- if $iamProfile }}
        iam.amazonaws.com/role: {{ .Values.addons.gitlab.objectStorage.iamProfile }}
        {{- end }}
        {{- if $istioEnabled }}
        {{ include "istioAnnotation" . }}
        {{- end }}
    sidekiq:
      annotations: 
        {{- if $iamProfile }}
        iam.amazonaws.com/role: {{ .Values.addons.gitlab.objectStorage.iamProfile }}
        {{- end }}
        {{- if $istioEnabled }}
        {{ include "istioAnnotation" . }}
        {{- end }}
    {{- end }}
    {{- end }}
  {{- if $istioEnabled }}
    migrations:
      annotations:
        {{ include "istioAnnotation" . }}
    gitaly:
      annotations:
        {{ include "istioAnnotation" . }}
      {{- if eq (include "metricsSidecarMtls" (list .Values.addons.gitlab .)) "true" }}
      metrics:
        serviceMonitor:
          endpointConfig:
            scheme: https
            tlsConfig:
              caFile: /etc/prom-certs/root-cert.pem
              certFile: /etc/prom-certs/cert-chain.pem
              keyFile: /etc/prom-certs/key.pem
              insecureSkipVerify: true  # Prometheus does not support Istio security naming, thus skip verifying target pod certificate
      {{- end }}
    gitlab-shell:
      annotations:
        {{ include "istioAnnotation" . }}
      {{- if eq (include "metricsSidecarMtls" (list .Values.addons.gitlab .)) "true" }}
      metrics:
        serviceMonitor:
          endpointConfig:
            scheme: https
            tlsConfig:
              caFile: /etc/prom-certs/root-cert.pem
              certFile: /etc/prom-certs/cert-chain.pem
              keyFile: /etc/prom-certs/key.pem
              insecureSkipVerify: true  # Prometheus does not support Istio security naming, thus skip verifying target pod certificate
      {{- end }}
    {{- if $kasEnabled }}
    kas:
      annotations:
        {{ include "istioAnnotation" . }}
      {{- if eq (include "metricsSidecarMtls" (list .Values.addons.gitlab .)) "true" }}
      metrics:
        serviceMonitor:
          endpointConfig:
            scheme: https
            tlsConfig:
              caFile: /etc/prom-certs/root-cert.pem
              certFile: /etc/prom-certs/cert-chain.pem
              keyFile: /etc/prom-certs/key.pem
              insecureSkipVerify: true  # Prometheus does not support Istio security naming, thus skip verifying target pod certificate
      {{- end }}
    {{- end }}
    praefect:
      annotations:
        {{ include "istioAnnotation" . }}
    gitlab-grafana:
      annotations:
        {{ include "istioAnnotation" . }}
  shared-secrets:
    annotations:
      {{ include "istioAnnotation" . }}
  minio:
    podAnnotations:
      {{ include "istioAnnotation" . }}
  {{- end }}

global:
  {{- if and .Values.addons.gitlab.sso.enabled (or (dig "certificateAuthority" "secretName" false .Values.sso) .Values.sso.secretName) }}
  certificates:
    customCAs:
      {{- if and .Values.addons.gitlab.sso.enabled (or .Values.sso.certificate_authority (dig "certificateAuthority" "cert" false .Values.sso)) }}
      - secret: {{ default (dig "certificateAuthority" "secretName" "" .Values.sso) .Values.sso.secretName }}
      {{- end }}
      - secret: ca-certs-australian-defence-organisation-cross-cert-chain
      - secret: ca-certs-australian-defence-organisation-direct-trust-chain
      - secret: ca-certs-boeing
      - secret: ca-certs-carillon-federal-services-trust-chain-1
      - secret: ca-certs-carillon-federal-services-trust-chain-2
      - secret: ca-certs-department-of-state-trust-chain-1
      - secret: ca-certs-department-of-state-trust-chain-2
      - secret: ca-certs-digicert-federal-ssp-trust-chain-1
      - secret: ca-certs-digicert-federal-ssp-trust-chain-2
      - secret: ca-certs-digicert-nfi-trust-chain-1
      - secret: ca-certs-digicert-nfi-trust-chain-2
      - secret: ca-certs-entrust-federal-ssp-trust-chain-1
      - secret: ca-certs-entrust-federal-ssp-trust-chain-2
      - secret: ca-certs-entrust-managed-service-nfi
      - secret: ca-certs-exostar-llc
      - secret: ca-certs-identrust-nfi
      - secret: ca-certs-lockheed-martin
      - secret: ca-certs-netherlands-ministry-of-defence
      - secret: ca-certs-northrop-grumman
      - secret: ca-certs-raytheon-trust-chain-1
      - secret: ca-certs-raytheon-trust-chain-2
      - secret: ca-certs-us-treasury-ssp-trust-chain-1
      - secret: ca-certs-us-treasury-ssp-trust-chain-2
      - secret: ca-certs-verizon-cybertrust-federal-ssp
      - secret: ca-certs-widepoint-federal-ssp-trust-chain-1
      - secret: ca-certs-widepoint-federal-ssp-trust-chain-2
      - secret: ca-certs-widepoint-nfi
      - secret: ca-certs-dod-intermediate-and-issuing-ca-certs
      - secret: ca-certs-dod-trust-anchors-self-signed
      - secret: ca-certs-eca
  {{end}}

  # added to help with Gitlab sub-chart configuration
  image:
    pullPolicy: {{ .Values.imagePullPolicy }}
    {{- include "secretsPullSecretsWithName" . | nindent 4 }}

  {{- include "secretsImagePullSecretsWithName" . | nindent 2 }}

  hosts:
    domain: {{ $domainName }}

    gitlab:
      name: {{ .Values.addons.gitlab.hostnames.gitlab }}.{{ $domainName }}

    registry:
      name: {{ .Values.addons.gitlab.hostnames.registry }}.{{ $domainName }}

  {{- if or (ne .Values.addons.gitlab.objectStorage.iamProfile "") $extObjStorageIsConfigured }}
  minio:
    enabled: false
  {{- end }}

  {{- if .Values.addons.gitlab.database.host }}
  psql:
    host: {{ .Values.addons.gitlab.database.host }}
    port: {{ .Values.addons.gitlab.database.port }}
    username: {{ .Values.addons.gitlab.database.username }}
    database: {{ .Values.addons.gitlab.database.database }}
    password:
      secret: gitlab-database
      key: PGPASSWORD
  {{- end }}

  {{- if $extObjStorageIsConfigured }}
  registry:
    {{- if .Values.addons.gitlab.objectStorage.bucketPrefix }}
    bucket: {{ .Values.addons.gitlab.objectStorage.bucketPrefix }}-gitlab-registry
    {{- else }}
    bucket: gitlab-registry
    {{- end }}
  {{- end }}

  {{- if or .Values.addons.gitlab.sso.enabled $extObjStorageIsConfigured $consolidatedObjStoreEnabled }}
  appConfig:
    {{- end }}

    {{- if .Values.addons.gitlab.sso.enabled }}
    omniauth:
      enabled: true
      {{- $global := .Values.addons.gitlab.values.global | default dict }}
      {{- $appConfig := $global.appConfig | default dict }}
      {{- $omniauth := $appConfig.omniauth | default dict }}
      {{- if hasKey $omniauth "allowSingleSignOn" }}
      allowSingleSignOn: {{ .Values.addons.gitlab.values.global.appConfig.omniauth.allowSingleSignOn }}
      {{- else }}
      allowSingleSignOn: ['openid_connect']
      {{- end }}
      {{- if hasKey $omniauth "blockAutoCreatedUsers" }}
      blockAutoCreatedUsers: {{ .Values.addons.gitlab.values.global.appConfig.omniauth.blockAutoCreatedUsers }}
      {{- else }}
      blockAutoCreatedUsers: false
      {{- end }}

      providers:
        - secret: gitlab-sso-provider
          key: gitlab-sso.json
    {{- end }}

    {{- if or $extObjStorageIsConfigured $consolidatedObjStoreEnabled }}
    {{- if and $extObjStorageIsConfigured $consolidatedObjStoreEnabled }}
    object_store:
      enabled: true
      connection:
        secret: gitlab-object-storage
        key: rails
    {{- end }}

    lfs:
      {{- if .Values.addons.gitlab.objectStorage.bucketPrefix }}
      bucket: {{ .Values.addons.gitlab.objectStorage.bucketPrefix }}-gitlab-lfs
      {{- else }}
      bucket: gitlab-lfs
      {{- end }}
      {{- if not $consolidatedObjStoreEnabled }}
      connection:
        secret: gitlab-object-storage
        key: rails
      {{- end }}

    artifacts:
      {{- if .Values.addons.gitlab.objectStorage.bucketPrefix }}
      bucket: {{ .Values.addons.gitlab.objectStorage.bucketPrefix }}-gitlab-artifacts
      {{- else }}
      bucket: gitlab-artifacts
      {{- end }}
      {{- if not $consolidatedObjStoreEnabled }}
      connection:
        secret: gitlab-object-storage
        key: rails
      {{- end }}

    uploads:
      {{- if .Values.addons.gitlab.objectStorage.bucketPrefix }}
      bucket: {{ .Values.addons.gitlab.objectStorage.bucketPrefix }}-gitlab-uploads
      {{- else }}
      bucket: gitlab-uploads
      {{- end }}
      {{- if not $consolidatedObjStoreEnabled }}
      connection:
        secret: gitlab-object-storage
        key: rails
      {{- end }}

    packages:
      {{- if .Values.addons.gitlab.objectStorage.bucketPrefix }}
      bucket: {{ .Values.addons.gitlab.objectStorage.bucketPrefix }}-gitlab-packages
      {{- else }}
      bucket: gitlab-packages
      {{- end }}
      {{- if not $consolidatedObjStoreEnabled }}
      connection:
        secret: gitlab-object-storage
        key: rails
      {{- end }}

    externalDiffs:
      {{- if .Values.addons.gitlab.objectStorage.bucketPrefix }}
      bucket: {{ .Values.addons.gitlab.objectStorage.bucketPrefix }}-gitlab-mr-diffs
      {{- else }}
      bucket: gitlab-mr-diffs
      {{- end }}
      {{- if not $consolidatedObjStoreEnabled }}
      connection:
        secret: gitlab-object-storage
        key: rails
      {{- end }}

    terraformState:
      {{- if .Values.addons.gitlab.objectStorage.bucketPrefix }}
      bucket: {{ .Values.addons.gitlab.objectStorage.bucketPrefix }}-gitlab-terraform-state
      {{- else }}
      bucket: gitlab-terraform-state
      {{- end }}
      {{- if not $consolidatedObjStoreEnabled }}
      connection:
        secret: gitlab-object-storage
        key: rails
      {{- end }}

    dependencyProxy:
      enabled: true
      {{- if .Values.addons.gitlab.objectStorage.bucketPrefix }}
      bucket: {{ .Values.addons.gitlab.objectStorage.bucketPrefix }}-gitlab-dependency-proxy
      {{- else }}
      bucket: gitlab-dependency-proxy
      {{- end }}
      {{- if not $consolidatedObjStoreEnabled }}
      connection:
        secret: gitlab-object-storage
        key: rails
      {{- end }}

    pseudonymizer:
      {{- if .Values.addons.gitlab.objectStorage.bucketPrefix }}
      bucket: {{ .Values.addons.gitlab.objectStorage.bucketPrefix }}-gitlab-pseudo
      {{- else }}
      bucket: gitlab-pseudo
      {{- end }}
      connection:
        secret: gitlab-object-storage
        key: rails

    backups:
      {{- if .Values.addons.gitlab.objectStorage.bucketPrefix }}
      bucket: {{ .Values.addons.gitlab.objectStorage.bucketPrefix }}-gitlab-backup
      {{- else }}
      bucket: gitlab-backup
      {{- end }}
      {{- if .Values.addons.gitlab.objectStorage.bucketPrefix }}
      tmpBucket: {{ .Values.addons.gitlab.objectStorage.bucketPrefix }}-gitlab-backup-tmp
      {{- else }}
      tmpBucket: gitlab-backup-tmp
    {{- end }}
  {{- end }}

  {{- if and (ne .Values.addons.gitlab.redis.password "") (or .Values.addons.gitlab.enabled .Values.addons.gitlabRunner.enabled) }}
  redis:
    auth:
      enabled: true
      secret: "gitlab-redis-secret-bb"
      key: "secret"
  {{- end }}

  {{- if .Values.addons.gitlab.smtp.password }}
  smtp:
    password:
      secret: "gitlab-smtp-password"
  {{- end }}

  {{- if .Values.addons.gitlab.railsSecret }}
  railsSecrets:
    secret: "gitlab-rails-secret-bb"
  {{- end }}


{{- if ne .Values.addons.gitlab.objectStorage.iamProfile "" }}
use_iam_profile: true
{{- end }}
{{- end -}}



{{- /* This function merges defaults in lists from above into overlays */ -}}
{{- /* The end user will not have to replicate exclusions/repos from above when providing an overlay */ -}}
{{- /* There is a hidden flag `skipOverlayMerge` that can be added to any certificates to ignore the defaults */ -}}
{{- define "bigbang.overlays.gitlab" }}

  {{- $defaults := fromYaml (include "bigbang.defaults.gitlab" .) }}

  {{- $overlays := dig "values" dict .Values.addons.gitlab }}
  {{- range $certificates, $default := $defaults.global }}
    {{- $overlay := (dig "global" $certificates dict $overlays) }}
    # Only continue if an overlay matches a default constriant and hidden "skipOverlayMerge" is not set
    {{- if and $overlay (not $overlay.skipOverlayMerge) }}

      # Add any default excludedNamespaces to overlay
      {{- if and (dig "customCAs"  list $default) (dig "customCAs"  list $overlay) }}

         {{ $_ := set $overlay "customCAs" (concat $default.customCAs $overlay.customCAs) }}

      {{- end }}
    {{- end }}
  {{- end }}
{{ toYaml $overlays }}
{{- end }}
