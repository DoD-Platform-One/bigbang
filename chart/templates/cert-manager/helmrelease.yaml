{{- include "bigbang.normalizePackageAliases" . -}}
{{- if .Values.certManager.enabled }}
{{- $fluxSettings := merge .Values.certManager.flux .Values.flux -}}
{{- $istioEnabled := eq (include "istioEnabled" .) "true" }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/component: "core"
    {{- include "commonLabels" . | nindent 4}}
  annotations:
    checksum/bigbang-values: {{ include (print $.Template.BasePath "/cert-manager/values.yaml") . | sha256sum }}
spec:
  targetNamespace: {{ .Values.certManager.namespace.name }}
  {{- include "bigbang.helmRelease.chartSpec" (dict "name" "cert-manager" "package" .Values.certManager "root" . "emitReleaseName" true) | nindent 2 }}
  {{- toYaml $fluxSettings | nindent 2 }}
  {{- if or .Values.monitoring.enabled .Values.certManager.postRenderers }}
  postRenderers:
  {{- if .Values.monitoring.enabled }}
    - kustomize:
        patches:
          - target:
              group: monitoring.coreos.com
              version: v1
              kind: ServiceMonitor
              name: cert-manager
            patch: |-
              - op: replace
                path: /spec/endpoints/0/scheme
                value: http
              - op: remove
                path: /spec/endpoints/0/tlsConfig
  {{- end }}
  {{- if .Values.certManager.postRenderers }}
  {{- toYaml .Values.certManager.postRenderers | nindent 4 }}
  {{- end }}
  {{- end }}
  {{- include "bigbang.helmRelease.valuesFrom" (dict "name" "cert-manager" "root" .) | nindent 2 }}
  {{- if or $istioEnabled .Values.kyvernoPolicies.enabled .Values.monitoring.enabled }}
  dependsOn:
  {{- if $istioEnabled }}
  {{- include "istioHelmReleases" . | nindent 4 }}
  {{- end }}
  {{- if .Values.kyvernoPolicies.enabled }}
    - name: kyverno-policies
      namespace: {{ .Release.Namespace }}
  {{- end }}
  {{- if .Values.monitoring.enabled }}
    - name: prometheus-operator-crds
      namespace: {{ .Release.Namespace }}
  {{- end }}
  {{- end }}
{{- end }}
