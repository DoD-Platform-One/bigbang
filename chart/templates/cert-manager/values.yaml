{{- include "bigbang.normalizePackageAliases" . -}}
{{- if .Values.certManager.enabled }}
{{- include "values-secret" (dict
  "root" $
  "package" .Values.certManager
  "name" "cert-manager"
  "bbCommonSubchart" true
  "defaults" (include "bigbang.defaults.cert-manager" .)
) }}
{{- end }}

{{- define "bigbang.defaults.cert-manager" -}}
{{- $domainName := default .Values.domain .Values.hostname }}
global:
  domain: {{ $domainName }}

upstream:
  prometheus:
    servicemonitor:
      enabled: {{ .Values.monitoring.enabled }}
      endpointAdditionalProperties:
        scheme: http
        enableHttp2: false

{{- end -}}
