{{- include "bigbang.normalizePackageAliases" . -}}
{{- $fluxSettings := merge .Values.addons.externalSecrets.flux .Values.flux -}}
{{- if .Values.addons.externalSecrets.enabled }}
{{- $istioEnabled := eq (include "istioEnabled" .) "true" }}
{{- $externalSecretsValues := .Values.addons.externalSecrets.values | default dict }}
{{- $istioWebhookPatch := and $istioEnabled (dig "upstream" "webhook" "create" false $externalSecretsValues) }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/component: "core"
    {{- include "commonLabels" . | nindent 4}}
  annotations:
    checksum/bigbang-values: {{ include (print $.Template.BasePath "/external-secrets/values.yaml") . | sha256sum }}
spec:
  targetNamespace: external-secrets
  {{- include "bigbang.helmRelease.chartSpec" (dict "name" "external-secrets" "package" .Values.addons.externalSecrets "root" . "emitReleaseName" true) | nindent 2 }}

  {{- toYaml $fluxSettings | nindent 2 }}

  {{- if or .Values.addons.externalSecrets.postRenderers $istioWebhookPatch }}
  postRenderers:
  {{- if $istioWebhookPatch }}
  {{- include "externalSecrets.istioPostRenderers" . | nindent 2 }}
  {{- end }}
  {{- with .Values.addons.externalSecrets.postRenderers }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
  {{- end }}
  {{- include "bigbang.helmRelease.valuesFrom" (dict "name" "external-secrets" "root" .) | nindent 2 }}

  {{- if or $istioEnabled .Values.kyvernoPolicies.enabled .Values.monitoring.enabled }}
  dependsOn:
  {{- if $istioEnabled }}
    {{- include "istioHelmReleases" . | nindent 4 }}
  {{- end }}
  {{- if .Values.kyvernoPolicies.enabled }}
    - name: kyverno-policies
      namespace: {{ .Release.Namespace }}
  {{- end }}
  {{- if .Values.monitoring.enabled }}
    - name: monitoring
      namespace: {{ .Release.Namespace }}
  {{- end }}
  {{- end }}
{{- end }}
